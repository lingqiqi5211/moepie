name: GUI

on:
  push:
    branches: [main]
    paths:
      - 'internal/gui/assets/**'
      - 'internal/gui/tests/**'
      - '.github/workflows/gui.yml'
  pull_request:
    paths:
      - 'internal/gui/assets/**'
      - 'internal/gui/tests/**'
      - '.github/workflows/gui.yml'
  workflow_dispatch:

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A few of the browser tests, on Chromium only: motion, languages, the
  # plugin pages, session lists, archive previews and hidden-page polling.
  # The rest still run by hand (internal/gui/tests/README.md).
  gui-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright and Chromium
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Test
        env:
          BROWSER: chromium
          ARTIFACT_DIR: ${{ runner.temp }}/shots
        run: |
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          cd internal/gui/tests
          node --test --test-concurrency=4 \
            reduce-motion.test.cjs skeleton-pulse.test.cjs tray-bird.test.cjs \
            i18n-keys.test.cjs header-relang.test.cjs lightweight.test.cjs \
            plugin-kernel.test.cjs plugin-page.test.cjs \
            sessions-paging.test.cjs sessions-folder-paging.test.cjs \
            sessions-manage-paging.test.cjs sessions-talk.test.cjs \
            request-archive.test.cjs request-archive-usage.test.cjs \
            routing-hidden-stage.test.cjs panel-routing-hidden.test.cjs \
            routing-hidden-down.test.cjs

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-shots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore
