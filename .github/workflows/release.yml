name: Release

# Build and publish only when explicitly requested; Test still gates the SHA.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Main commit or tag to build (must have a green Test)'
        type: string
        default: main
      version:
        description: 'Optional 0.1.N version; empty increments the highest local tag'
        type: string
      publish:
        description: 'Publish after checks (off builds artifacts only)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Version allocation and publication share one queue.
concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate main, Test and version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: node .github/scripts/release-prepare.mjs

  mac:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout moepie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Probe macOS signing secrets
        id: signing
        env:
          P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::MAC_CERTIFICATE_P12 not set — the mac build will be ad-hoc signed and not notarised."
          fi

      - name: Import macOS certificates
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f $RUNNER_TEMP/certificate.p12

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in MAC_CERTIFICATE_P12"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> $GITHUB_ENV

      - name: Build moepie.app
        run: make app VERSION="$VERSION"

      - name: Sign moepie.app
        run: |
          if [ -n "$IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$IDENTITY" moepie.app
          else
            codesign --force --sign - moepie.app
          fi
          codesign --verify --strict --verbose=2 moepie.app
          codesign -dv --verbose=2 moepie.app 2>&1 | grep -E 'Authority|TeamIdentifier|flags|Identifier'

      - name: Build dmg
        run: |
          DMG=moepie-darwin-${{ matrix.arch }}.dmg
          mkdir -p $RUNNER_TEMP/dmg
          cp -R moepie.app $RUNNER_TEMP/dmg/
          ln -s /Applications $RUNNER_TEMP/dmg/Applications
          # The Intel runners' hdiutil fails now and then with "create
          # failed - Resource busy" while something still holds the image
          # it makes; the release was lost each time (yetone/magpie#1846).
          # The image's size is given, not left to hdiutil's guess from the
          # folder: on the Intel runners the guess came out short and every
          # try failed "No space left on device" copying the app in.
          SIZE=$(( $(du -sm $RUNNER_TEMP/dmg | cut -f1) * 5 / 4 + 32 ))m
          for try in 1 2 3 4 5; do
            hdiutil create -volname moepie -srcfolder $RUNNER_TEMP/dmg -size $SIZE -ov -format UDZO "$DMG" && break
            [ "$try" = 5 ] && exit 1
            echo "hdiutil create failed (try $try), trying again"
            rm -f "$DMG"
            sleep $((try * 10))
          done
          if [ -n "$IDENTITY" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          fi
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Notarise and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > $RUNNER_TEMP/AuthKey.p8
            AUTH=(--key $RUNNER_TEMP/AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          # The dmg's ticket covers the app inside it too, so one submission
          # does for both: staple the dmg, and the app for the zip.
          OUT=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m --output-format json)
          echo "$OUT"
          ID=$(echo "$OUT" | jq -r .id)
          STATUS=$(echo "$OUT" | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f $RUNNER_TEMP/AuthKey.p8
            echo "::error::Notarisation $STATUS"
            exit 1
          fi
          rm -f $RUNNER_TEMP/AuthKey.p8
          # stapler fetches the ticket from Apple's CloudKit, which drops the
          # connection now and then (error 68): try again, and if it is still
          # down, ship the build unstapled. It is notarised (Accepted above),
          # so Gatekeeper looks the ticket up online on first open; failing
          # here left whole releases unpublished (#2778: v0.1.1284, 1385,
          # 1386, 1541, 1824, 1827).
          stapled=1
          staple() {
            for i in 1 2 3 4 5; do
              xcrun stapler staple "$1" && return 0
              echo "staple $1 failed (try $i), retrying in $((i * 20))s"
              sleep $((i * 20))
            done
            echo "::warning::$1 ships notarised but unstapled: Apple's ticket service stayed unreachable"
            stapled=0
          }
          staple "$DMG"
          staple moepie.app
          if [ "$stapled" = 1 ]; then
            spctl --assess --type execute --verbose=2 moepie.app
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          else
            # spctl would ask the same unreachable service; the signature is
            # still checked, offline
            codesign --verify --deep --strict --verbose=2 moepie.app
            codesign --verify --strict --verbose=2 "$DMG"
          fi

      - name: Zip moepie.app
        run: ditto -c -k --keepParent moepie.app moepie-darwin-${{ matrix.arch }}.zip

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-darwin-${{ matrix.arch }}
          path: |
            moepie-darwin-*.dmg
            moepie-darwin-*.zip
          if-no-files-found: error

  # The terminal-only moepie (no GUI, no cgo) and the Windows app (WebView2,
  # no cgo either) cross-compile from one runner.
  cli:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout moepie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make release-cli release-windows VERSION="$VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-cli
          path: |
            dist/moepie-cli-*
            dist/moepie-windows-*.exe
          if-no-files-found: error

  # Launch the Windows app for real: it has to come up and serve the gateway.
  windows-check:
    needs: [prepare, cli]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-cli
          path: dist

      - name: Launch moepie
        shell: pwsh
        run: |
          $env:MAGPIE_UPDATE_FEED = "http://127.0.0.1:9/"
          $exe = "dist\moepie-windows-${{ matrix.arch }}.exe"
          $v = (& $exe --version | Out-String).Trim()
          Write-Output $v
          if ($v -notlike "moepie $env:VERSION*") { throw "unexpected version: $v" }
          $log = "$env:RUNNER_TEMP\moepie"
          $p = Start-Process -FilePath $exe -ArgumentList app -PassThru -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err"
          function Fail($why) { Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue; throw $why }
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Fail "moepie exited with $($p.ExitCode)" }
            try { Invoke-WebRequest http://127.0.0.1:3425/v1/models -UseBasicParsing | Out-Null; $ok = $true; break } catch {}
          }
          if (-not $ok) { Fail "the gateway never answered" }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { Fail "moepie exited with $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Write-Output "moepie ran and served the gateway"

  # The Linux app links GTK 3 and WebKitGTK 4.1, so each arch builds on its
  # own runner. Ubuntu 22.04 keeps the glibc requirement low.
  linux:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout moepie source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11

      - name: Build
        run: make release-linux VERSION="$VERSION"

      - name: Launch moepie
        run: |
          BIN=dist/moepie-linux-${{ matrix.arch }}
          $BIN --version | grep -F "moepie $VERSION"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/moepie-config"
          # no update: a release published while this one builds is newer,
          # and the app would download it beside itself as $BIN.new, which
          # went out as v0.1.1611's moepie-linux-amd64.new (15.8MB of 1612)
          export MAGPIE_UPDATE_FEED=http://127.0.0.1:9/
          xvfb-run -a dbus-launch --exit-with-session $BIN app > $RUNNER_TEMP/moepie.log 2>&1 &
          for i in $(seq 30); do
            sleep 2
            curl -fs -o /dev/null http://127.0.0.1:3425/v1/models && break
          done
          sleep 5
          curl -fs -o /dev/null http://127.0.0.1:3425/v1/models || { cat $RUNNER_TEMP/moepie.log; echo "::error::moepie did not come up"; exit 1; }
          pkill -f "$BIN" || true
          echo "moepie ran and served the gateway"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist/moepie-linux-${{ matrix.arch }}
          if-no-files-found: error
  publish:
    needs: [prepare, mac, cli, windows-check, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete assets and generate checksums
        run: node .github/scripts/release-assets.mjs
      - name: Generate bilingual release notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
        run: node .github/scripts/release-notes.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-manifest
          path: |
            dist/SHA256SUMS
            dist/release-notes.md
      - name: Publish fork release
        if: env.PUBLISH == 'true'
        run: node .github/scripts/release-publish.mjs
