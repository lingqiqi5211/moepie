name: UI preview cleanup

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# Share the writer queue with preview publication. Git leases also protect
# against a run already in flight from an older version of the workflow.
concurrency:
  group: ui-preview-media
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted default-branch code; never check out the closed PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove previews of closed pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/ui-preview/publish.mjs cleanup
